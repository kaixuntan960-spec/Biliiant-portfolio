<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Suppress HDR/Environment load failures in embedded browsers (e.g. VS Code) -->
    <script>
      window.addEventListener("unhandledrejection", (e) => {
        if (e.reason?.message?.includes?.("dikhololo") || e.reason?.message?.includes?.("Failed to fetch") || e.reason?.message?.includes?.("HDR")) {
          e.preventDefault();
        }
      });
    </script>
    <!-- Ensures embedded IDE browsers / collapsed panels still reserve viewport height before JS/CSS loads -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paico Generated Project</title>
    <meta name="description" content="Paico Generated Project" />
    <meta name="author" content="Paico" />
    <meta property="og:image" content="/og-image.png" />
  </head>

  <body>
    <noscript>需要启用 JavaScript 才能查看本站。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
